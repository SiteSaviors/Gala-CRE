<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Gala CRE completed transaction graphic</title>
  <desc id="desc">An abstract charcoal and gold architectural grid used when property photography is not published.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.58" stop-color="#171713"/>
      <stop offset="1" stop-color="#2a261b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c6518"/>
      <stop offset="0.5" stop-color="#d2ae53"/>
      <stop offset="1" stop-color="#f1db98"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <path d="M-80 850 530 230l330 330L1510-90" fill="none" stroke="url(#gold)" stroke-width="5" stroke-opacity="0.7"/>
  <path d="M140 1000 690 450l255 255L1600 45" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M880 1000 1600 280V1000Z" fill="#d2ae53" fill-opacity="0.08"/>
  <circle cx="1315" cy="710" r="220" fill="none" stroke="#d2ae53" stroke-width="2" stroke-opacity="0.24"/>
  <circle cx="1315" cy="710" r="145" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/>
  <g fill="#ffffff">
    <text x="230" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GALA CRE GROUP</text>
    <text x="230" y="795" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">COMPLETED</text>
    <text x="230" y="875" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">TRANSACTION</text>
  </g>
  <rect x="230" y="188" width="150" height="5" fill="url(#gold)"/>
</svg>
